# Supabase CLI settings for local development (`supabase start`).
# The hosted project is configured in its dashboard; see supabase/README.md.
project_id = "wedding-site"

[auth]
# Guests are anonymous Supabase users, one per phone.
enable_anonymous_sign_ins = true

[functions.songs]
verify_jwt = true

[functions.camera]
verify_jwt = true

# Disposable camera photos: private, JPEG only (phones re-encode before
# upload), 8 MB cap enforced by Storage itself.
[storage.buckets.photos]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg"]

# Opened as a plain link from Safari (no Authorization header): the pass
# token in the URL is the credential, checked in the database.
[functions.wallet]
verify_jwt = false

# Signed Apple Wallet passes, one per guest, made by scripts/make_wallet_passes.py.
[storage.buckets.wallet]
public = false
file_size_limit = "2MiB"
allowed_mime_types = ["application/vnd.apple.pkpass"]
